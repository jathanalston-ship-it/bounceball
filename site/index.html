<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UBL · United Bounceball League</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header><a class="logo" href="#">UBL</a><div><b>United Bounceball League</b><small id="sub">Loading the record…</small></div></header>
<nav class="main">
  <a data-v="standings" href="#standings">Standings</a><a data-v="leaders" href="#leaders">Leaders</a><a data-v="games" href="#games">Games</a><a data-v="history" href="#history">History</a><a data-v="hof" href="#hof">Hall of Fame</a><a data-v="blotter" href="#blotter">Blotter</a><a data-v="coaches" href="#coaches">Coaches</a><a data-v="teams" href="#teams">Teams</a><a data-v="moves" href="#moves">Moves</a>
</nav>
<section id="broadcast" hidden>
  <div id="channels" class="channels" hidden></div>
  <div class="courtwrap" id="courtwrap">
    <canvas id="court3d"></canvas><canvas id="court" hidden></canvas>
    <div class="bug tv" id="bug"></div>
    <div class="l3" id="l3"></div>
    <div class="callout" id="callout"></div>
    <div class="calltag" id="calltag"></div>
    <div class="plancard" id="plancard"></div>
    <div class="replaytag" id="replayTag" hidden>REPLAY</div>
    <div class="overlay" id="bc-overlay" hidden>Loading…</div>
  </div>
  <div class="controls">
    <button id="rew" title="Back 10 seconds">↺10</button><button id="play">▶</button>
    <div class="spd"><button data-s="1">1×</button><button data-s="2" class="on">2×</button><button data-s="4">4×</button><button data-s="10">10×</button><button data-s="30">30×</button></div>
    <button id="end">Final ⏭</button>
    <select id="cam" aria-label="Camera"><option value="auto">Auto camera</option><option value="sideline">Sideline</option><option value="endline">Behind the basket</option><option value="follow">Follow the ball</option><option value="overhead">Overhead</option><option value="tactical">Tactical (2D)</option></select>
    <button id="snd" title="Sound">🔈</button><button id="rpl" class="on" title="Automatic instant replays">Replays</button><button id="plans" title="Show both teams' gameplans">Plans</button><button id="fs" title="Fullscreen">⛶</button>
    <input type="range" id="scrub" min="0" max="1" value="0" step="1" aria-label="Game timeline">
  </div>
  <div class="seed" id="seed"></div>
  <nav class="tabs bctabs"><button data-t="pbp" class="on">Play-by-play</button><button data-t="box">Box score</button><button data-t="strat">Strategy</button></nav>
  <section class="bctab" id="bc-pbp"><label class="chk"><input type="checkbox" id="subs"> show substitutions</label> <label class="chk"><input type="checkbox" id="calls" checked> show play calls</label><ul id="pbp-list"></ul></section>
  <section class="bctab" id="bc-box" hidden><div id="box-tables"></div></section>
  <section class="bctab" id="bc-strat" hidden><div id="strat-body"></div></section>
</section>
<main id="view"></main>
</div>
<script src="vendor/three.min.js"></script>
<script src="../src/engine.js"></script>
<script src="../src/players.js"></script>
<script src="../src/teams.js"></script>
<script src="broadcast3d.js"></script>
<script src="broadcast.js"></script>
<script src="hub.js"></script>
</body>
</html>
